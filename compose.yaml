name: tebuireng-local

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: absensi_santri
      MYSQL_USER: tebuireng
      MYSQL_PASSWORD: tebuireng-local
      MYSQL_ROOT_PASSWORD: root-local
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-local --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: tebuireng-local-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - ./backend/.env
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./xlsx:/var/www/xlsx:ro
      - ./docs:/var/www/docs:ro
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/ready') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  frontend:
    image: tebuireng-local-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /tmp
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  test:
    profiles: ["tools"]
    image: tebuireng-local-backend:dev
    user: "1000:1000"
    env_file:
      - ./backend/.env.testing
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      SKIP_MIGRATIONS: "true"
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      FORCE_PASSWORD_CHANGE: "true"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command: ["php", "artisan", "test"]

volumes:
  mysql_data:
    external: true
    name: tebuireng_mysql_data
  backend_vendor:
  frontend_node_modules:
